<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- TeHyBug CO2 Desk: pin mapping of the 3.5mm sensor jack.
       Assignments mirror the firmware (tehybug_co2_desk_firmware.ino):
       tip = 3.3V, ring1 = SDA (IO_0/GPIO0), ring2 = SCL (IO_2/GPIO2), sleeve = GND. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e9e9e"/>
      <stop offset="0.25" stop-color="#e9e9e9"/>
      <stop offset="0.5" stop-color="#f6f6f6"/>
      <stop offset="0.75" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.3" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#4a4a4a"/>
      <stop offset="0.8" stop-color="#262626"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="1000" fill="#ffffff"/>
  <text x="320" y="78" text-anchor="middle" font-size="62" font-weight="bold" fill="#1a1a1a">Pin Mapping</text>
  <text x="320" y="116" text-anchor="middle" font-size="26" fill="#777">3.5 mm sensor jack (TRRS)</text>

  <!-- ===== plug, centered at x=320 ===== -->
  <!-- tip: rounded cap, slight bulge, then a narrow neck groove -->
  <path d="M 320 138
           C 298 138 280 154 280 178
           L 280 200
           C 280 222 298 230 298 248
           L 298 264
           C 298 276 286 280 286 292
           L 286 308
           L 354 308
           L 354 292
           C 354 280 342 276 342 264
           L 342 248
           C 342 230 360 222 360 200
           L 360 178
           C 360 154 342 138 320 138
           Z" fill="url(#metal)" stroke="#6f6f6f" stroke-width="2"/>
  <!-- insulator 1 -->
  <rect x="286" y="308" width="68" height="16" fill="#111"/>
  <!-- ring 1 -->
  <rect x="286" y="324" width="68" height="106" fill="url(#metal)" stroke="#6f6f6f" stroke-width="2"/>
  <!-- insulator 2 -->
  <rect x="286" y="430" width="68" height="16" fill="#111"/>
  <!-- ring 2 -->
  <rect x="286" y="446" width="68" height="106" fill="url(#metal)" stroke="#6f6f6f" stroke-width="2"/>
  <!-- insulator 3 -->
  <rect x="286" y="552" width="68" height="16" fill="#111"/>
  <!-- sleeve -->
  <rect x="286" y="568" width="68" height="118" fill="url(#metal)" stroke="#6f6f6f" stroke-width="2"/>
  <!-- collar -->
  <rect x="266" y="686" width="108" height="26" rx="6" fill="url(#metal)" stroke="#6f6f6f" stroke-width="2"/>
  <!-- plastic body -->
  <path d="M 232 728
           Q 232 712 250 712
           L 390 712
           Q 408 712 408 728
           L 408 920 L 232 920 Z" fill="url(#plastic)"/>

  <!-- ===== labels with leader lines ===== -->
  <!-- tip: 3.3V -->
  <line x1="358" y1="206" x2="448" y2="206" stroke="#999" stroke-width="3"/>
  <circle cx="358" cy="206" r="5" fill="#999"/>
  <text x="462" y="228" font-size="56" font-weight="bold" fill="#d62828">3.3V</text>

  <!-- ring 1: SDA / IO_0 -->
  <line x1="286" y1="377" x2="196" y2="377" stroke="#999" stroke-width="3"/>
  <circle cx="286" cy="377" r="5" fill="#999"/>
  <text x="182" y="395" text-anchor="end" font-size="56" font-weight="bold" fill="#2a9d2a">SDA</text>
  <line x1="354" y1="377" x2="448" y2="377" stroke="#999" stroke-width="3"/>
  <circle cx="354" cy="377" r="5" fill="#999"/>
  <text x="462" y="395" font-size="56" font-weight="bold" fill="#1d5fbf">IO_0</text>

  <!-- ring 2: SCL / IO_2 -->
  <line x1="286" y1="499" x2="196" y2="499" stroke="#999" stroke-width="3"/>
  <circle cx="286" cy="499" r="5" fill="#999"/>
  <text x="182" y="517" text-anchor="end" font-size="56" font-weight="bold" fill="#2a9d2a">SCL</text>
  <line x1="354" y1="499" x2="448" y2="499" stroke="#999" stroke-width="3"/>
  <circle cx="354" cy="499" r="5" fill="#999"/>
  <text x="462" y="517" font-size="56" font-weight="bold" fill="#1d5fbf">IO_2</text>

  <!-- sleeve: GND -->
  <line x1="354" y1="627" x2="448" y2="627" stroke="#999" stroke-width="3"/>
  <circle cx="354" cy="627" r="5" fill="#999"/>
  <text x="462" y="645" font-size="56" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- footnote -->
  <text x="320" y="968" text-anchor="middle" font-size="24" fill="#999">I2C: SDA = GPIO0, SCL = GPIO2 &#183; TeHyBug CO2 Desk</text>
</svg>
