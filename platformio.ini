; PlatformIO Configuration File
; TeHyBug CO2 Desk Firmware
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor
; Upload SPIFFS: pio run --target uploadfs
; Clean: pio run --target clean

[platformio]
default_envs = nodemcuv2
src_dir = .
data_dir = data

; ============================================================================
; Common settings for all environments
; ============================================================================
[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, colorize
upload_speed = 921600

; Build flags
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D BEARSSL_SSL_BASIC
    ; Optimize for size
    -Os
    ; Enable exceptions for ArduinoJson
    -fexceptions
    ; Warning flags
    -Wall
    -Wextra
    -Wno-unused-parameter

; Library dependencies
lib_deps = 
    ; JSON parsing
    bblanchon/ArduinoJson@^6.21.5
    
    ; MQTT client
    knolleary/PubSubClient@^2.8
    
    ; WiFi configuration portal
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    
    ; NeoPixel LEDs
    adafruit/Adafruit NeoPixel@^1.12.0
    
    ; Graphics library for display
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.15.0
    
    ; E-Paper display
    zinggjm/GxEPD@^3.1.5
    
    ; Button handling
    lennarthennigs/Button2@^2.3.2
    
    ; Task scheduler
    https://github.com/Toshik/TickerScheduler.git
    
    ; CO2 sensor (SCD4x)
    sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
    
    ; Temperature/Pressure sensor (BME280/BMP280)
    https://github.com/Erriez/ErriezBMX280.git
    
    ; Temperature/Humidity sensor (AHT20)
    adafruit/Adafruit AHTX0@^2.0.5
    
    ; Particulate matter sensor (SPS30)
    sensirion/Sensirion I2C SPS30@^0.1.0
    sensirion/Sensirion Core@^0.7.1

; OTA settings
upload_protocol = espota
upload_flags = 
    --auth=TEHYBUG-CO2

; File system
board_build.filesystem = spiffs

; ============================================================================
; NodeMCU v2 (most common)
; ============================================================================
[env:nodemcuv2]
board = nodemcuv2
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m2m.ld

; 4MB flash with 2MB for filesystem
board_build.partitions = min_spiffs.csv

; ============================================================================
; Wemos D1 Mini
; ============================================================================
[env:d1_mini]
board = d1_mini
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m2m.ld

; ============================================================================
; Wemos D1 Mini Pro (16MB flash)
; ============================================================================
[env:d1_mini_pro]
board = d1_mini_pro
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.16m14m.ld

; ============================================================================
; Generic ESP8266 (4MB)
; ============================================================================
[env:esp8266_4mb]
board = esp12e
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m2m.ld

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.2m.ld
; ============================================================================
; Debug build
; ============================================================================
[env:debug]
board = nodemcuv2
build_type = debug
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m2m.ld

build_flags = 
    ${env.build_flags}
    -D DEBUG_ESP_PORT=Serial
    -D DEBUG_ESP_CORE
    -D DEBUG_ESP_WIFI
    -D DEBUG_ESP_HTTP_CLIENT
    -D DEBUG_ESP_OTA

; Extra debugging
monitor_filters = esp8266_exception_decoder, colorize, time

; ============================================================================
; Release build (optimized)
; ============================================================================
[env:release]
board = nodemcuv2
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m2m.ld

build_flags = 
    ${env.build_flags}
    -D NDEBUG
    -O2

; ============================================================================
; OTA Upload (after initial flash)
; ============================================================================
[env:ota]
board = nodemcuv2
upload_protocol = espota
upload_port = tehybug.local
upload_flags = 
    --port=8266
    --auth=TEHYBUG-CO2

; Fallback: use IP address if mDNS doesn't work
; upload_port = 192.168.1.100
